name: newshub
description: "A modern news app with GetX"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  get: ^4.7.2
  dio: ^5.7.0
  google_fonts: ^4.0.4
  carousel_slider: ^5.0.0
  path: ^1.9.1
  badges: ^3.1.2
  flutter_screenutil: ^5.9.0
  shared_preferences: ^2.3.3
  image_picker: ^1.2.0
  get_storage: ^2.1.1
  fl_chart: ^0.69.0
  intl: ^0.19.0
  http: ^0.13.5
  video_player: ^2.8.6
  path_provider: ^2.1.5
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter:

  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Battambang
      fonts:
        - asset: assets/fonts/Battambang-Regular.ttf
        # - asset: assets/fonts/Battambang-Black.ttf
        # - asset: assets/fonts/Battambang-Bold.ttf
        # - asset: assets/fonts/Battambang-Light.ttf
        # - asset: assets/fonts/Battambang-Thin.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
