name: newshub
description: "A modern news app with GetX"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  dio: ^5.7.0 #http request
  flutter_secure_storage: ^9.2.2 # save simple data to storage device
  google_fonts: ^4.0.4 #change font (compatible with http 0.13.x)
  carousel_slider: ^5.0.0 # slide
  sqflite: ^2.4.2 #handle local database (sql query)
  path: ^1.9.1 # get app directory
  badges: ^3.1.2 # badege count
  modal_bottom_sheet: ^3.0.0 #modal
  flutter_screenutil: ^5.9.0
  #  push notification
  #  firebase_core: ^2.32.0
  #  firebase_messaging: ^14.7.10
  #  awesome_notifications: ^0.10.0
  smooth_page_indicator: ^1.2.0+3

  connectivity_plus: ^6.0.2 # check internet connection
  cached_network_image: ^3.3.1 # cache image
  #  skeletonizer: ^1.1.2+1
  animated_splash_screen: ^1.3.0
  #  rive: ^0.13.15
  vibration: ^2.0.1
  gradient_borders: ^1.0.1
  timeago: ^3.7.0 # convert datatime or date time format
  haptic_feedback: ^0.5.1+1
  firebase_analytics: ^10.10.7
  logger: ^2.4.0
  faker: ^2.2.0 # random
#  google_maps_flutter: ^2.10.0 # display current location user
  geolocator: ^13.0.2 #get current location
  permission_handler: ^11.3.1 #
  geocoding: ^3.0.0
  flutter_slidable: ^4.0.3
  flutter_onboarding_slider: ^1.0.11
  shared_preferences: ^2.3.3
  change_app_package_name: ^1.4.0
  image_picker: ^1.2.0
  get_storage: ^2.1.1
  fl_chart: ^0.69.0 # charts for dashboard
  intl: ^0.19.0 # number formatting

  share_plus: ^7.2.2
  http: ^0.13.5
  video_player: ^2.8.6
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


