name: newshub
description: "A modern news app with GetX"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  google_fonts: ^4.0.4
  carousel_slider: ^5.0.0
  path: ^1.9.1
  badges: ^3.1.2
  modal_bottom_sheet: ^3.0.0
  flutter_screenutil: ^5.9.0
  smooth_page_indicator: ^1.2.0+3
  connectivity_plus: ^6.0.2
  cached_network_image: ^3.3.1
  animated_splash_screen: ^1.3.0
  vibration: ^2.0.1
  gradient_borders: ^1.0.1
  timeago: ^3.7.0
  haptic_feedback: ^0.5.1+1
  firebase_analytics: ^10.10.7
  logger: ^2.4.0
  faker: ^2.2.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  geocoding: ^3.0.0
  flutter_slidable: ^4.0.3
  flutter_onboarding_slider: ^1.0.11
  shared_preferences: ^2.3.3
  change_app_package_name: ^1.4.0
  image_picker: ^1.2.0
  get_storage: ^2.1.1
  fl_chart: ^0.69.0
  intl: ^0.19.0
  share_plus: ^7.2.2
  http: ^1.6.0
  video_player: ^2.8.6
  path_provider: ^2.1.5
  charts_flutter: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter:

  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Battambang
      fonts:
        - asset: assets/fonts/Battambang-Regular.ttf
        # - asset: assets/fonts/Battambang-Black.ttf
        # - asset: assets/fonts/Battambang-Bold.ttf
        # - asset: assets/fonts/Battambang-Light.ttf
        # - asset: assets/fonts/Battambang-Thin.ttf
